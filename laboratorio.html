<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Futlive • LAB Frames</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07110e;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overflow-x:hidden}.hud{height:54px;display:flex;align-items:center;justify-content:center;background:#075d2c;position:sticky;top:0;z-index:20;border-bottom:1px solid #ffffff18}.hud b{font-size:15px;letter-spacing:.04em}.shell{width:min(1500px,100%);margin:0 auto;padding:10px}.workspace{display:grid;grid-template-columns:minmax(360px,480px) minmax(0,1fr);gap:12px;align-items:start}.controls{position:sticky;top:64px;background:#0a1712;border:1px solid #29443a;border-radius:14px;padding:12px;max-height:calc(100vh - 76px);overflow:auto}.gallery{min-width:0;background:#0a1712;border:1px solid #29443a;border-radius:14px;padding:12px}.title{font-size:10px;letter-spacing:1.2px;color:#a8c8b6;font-weight:900;margin:10px 0 6px}.row{display:flex;gap:6px;overflow:auto;padding:5px 0}.wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}.wrap button{white-space:normal;min-height:42px}button{border:1px solid #29443a;background:#0d211a;color:#fff;padding:10px 11px;border-radius:9px;font-weight:800;font-size:11px;white-space:nowrap;cursor:pointer;touch-action:manipulation}button:hover{background:#143126}button.active{outline:2px solid #ffd84d;background:#28351a}.save{background:#164d2c;border-color:#43b66c}.previewbox{display:grid;grid-template-columns:150px minmax(0,1fr);gap:13px;align-items:center;background:#0b1c16;border:1px solid #29443a;border-radius:12px;padding:10px}.preview{width:150px;height:165px;object-fit:contain;background:#04100b;border-radius:9px}.meta{min-width:0}.frameName{font:900 17px ui-monospace,monospace;color:#ffe36b;word-break:break-all}.path{font:10px ui-monospace,monospace;color:#9cc9b0;margin-top:7px;word-break:break-all;line-height:1.35}.navrow button{min-width:54px;font-size:16px}.strip{display:grid;grid-template-columns:repeat(8,minmax(72px,1fr));gap:6px}.thumb{position:relative;min-width:0;height:108px;border:1px solid #27473a;border-radius:7px;background:#06100c;padding:3px;overflow:hidden;cursor:pointer}.thumb:hover{border-color:#68a985}.thumb img{width:100%;height:82px;object-fit:contain}.thumb.on{border:2px solid #ffd84d;background:#172314}.thumb span{display:block;text-align:center;font:8px ui-monospace,monospace;color:#d9eee2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.read{margin-top:10px;font:10px/1.45 ui-monospace,monospace;color:#9cc9b0;background:#030806;padding:9px;border-radius:8px;white-space:pre-wrap;max-height:160px;overflow:auto}.mobileTitle{display:none}
@media(max-width:1050px){.workspace{grid-template-columns:390px minmax(0,1fr)}.strip{grid-template-columns:repeat(6,minmax(70px,1fr))}.previewbox{grid-template-columns:120px 1fr}.preview{width:120px;height:135px}.wrap{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.hud{height:46px}.hud b{font-size:13px}.shell{padding:7px}.workspace{display:block}.controls{position:static;max-height:none;padding:9px}.gallery{margin-top:8px;padding:9px}.previewbox{grid-template-columns:92px 1fr}.preview{width:92px;height:102px}.frameName{font-size:14px}.path{font-size:8px}.wrap{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap button{min-height:40px;padding:8px 6px;font-size:10px}.strip{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.thumb{height:92px}.thumb img{height:68px}.mobileTitle{display:block}.desktopTitle{display:none}.row.actions{display:grid;grid-template-columns:1fr 1fr;overflow:visible}.row.actions button{width:100%}}
@media(max-width:390px){.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.previewbox{grid-template-columns:82px 1fr}.preview{width:82px;height:92px}}
</style></head><body><div class="hud"><b>🧪 LAB • MAPA DE FRAMES</b></div><main class="shell"><div class="workspace"><section class="controls"><div class="title">PERSONAGEM</div><div class="row"><button data-char="blue">🔵 AZUL</button><button data-char="red">🔴 VERMELHO</button><button data-char="ref">🟨 JUIZ</button></div><div class="previewbox"><img id="preview" class="preview"><div class="meta"><div id="frameName" class="frameName"></div><div id="framePath" class="path"></div><div class="row navrow"><button id="prev">←</button><button id="next">→</button></div></div></div><div class="title">MARCAR O QUE ESTE ARQUIVO É</div><div class="row wrap"><button data-mark="frente">Frente</button><button data-mark="costas">Costas</button><button data-mark="direita">Direita</button><button data-mark="esquerda">Esquerda</button><button data-mark="parado">Parado</button><button data-mark="corrida">Corrida</button><button data-mark="chute_passe">Chute/Passe</button><button data-mark="carrinho">Carrinho</button><button data-mark="segura_bola">Segura bola</button><button data-mark="lateral_maos">Lateral/mãos</button><button id="unmark">Desmarcar</button></div><div class="row actions"><button id="save" class="save">💾 SALVAR</button><button id="copy">📋 COPIAR TUDO</button></div><div id="read" class="read"></div></section><section class="gallery"><div class="title desktopTitle">32 ARQUIVOS — CLIQUE PARA SELECIONAR</div><div class="title mobileTitle">32 ARQUIVOS — TOQUE PARA SELECIONAR</div><div id="strip" class="strip"></div></section></div></main><script>(()=>{const KEY='futlive_lab_filemap_v2',P=document.querySelector('#preview'),N=document.querySelector('#frameName'),PATH=document.querySelector('#framePath'),STRIP=document.querySelector('#strip'),READ=document.querySelector('#read');let char='blue',frame=1,map={};try{map=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}const pad=n=>String(n).padStart(3,'0');function info(){if(char==='blue')return{label:'AZUL',file:'frame_'+pad(frame)+'.png',path:'assets/players/team-1/frame_'+pad(frame)+'.png'};if(char==='red')return{label:'VERMELHO',file:'frame_'+pad(frame)+'.png',path:'assets/players/team-2/frame_'+pad(frame)+'.png'};return{label:'JUIZ',file:'frame_'+pad(frame)+'.png',path:'assets/referee/frame_'+pad(frame)+'.png'}}function key(){let i=info();return i.label+' / '+i.file}function render(){let i=info();P.src='./'+i.path;N.textContent=i.file;PATH.textContent=i.label+' • '+i.path;document.querySelectorAll('[data-char]').forEach(b=>b.classList.toggle('active',b.dataset.char===char));document.querySelectorAll('[data-mark]').forEach(b=>b.classList.toggle('active',b.dataset.mark===map[key()]));STRIP.innerHTML='';for(let n=1;n<=32;n++){let old=frame;frame=n;let x=info();frame=old;let d=document.createElement('div');d.className='thumb'+(n===frame?' on':'');d.innerHTML='<img src="./'+x.path+'"><span>'+x.file+'</span>';d.onclick=()=>{frame=n;render();if(innerWidth<=760)document.querySelector('.controls').scrollIntoView({behavior:'smooth',block:'start'})};STRIP.appendChild(d)}READ.textContent=(map[key()]?'MARCADO: '+map[key()]+'\n':'')+'ARQUIVO ATUAL: '+key()}document.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{char=b.dataset.char;frame=1;render()});document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>{map[key()]=b.dataset.mark;render()});prev.onclick=()=>{frame=frame<=1?32:frame-1;render()};next.onclick=()=>{frame=frame>=32?1:frame+1;render()};unmark.onclick=()=>{delete map[key()];render()};save.onclick=()=>{localStorage.setItem(KEY,JSON.stringify(map));READ.textContent='✅ SALVO neste aparelho.\n'+key()+' = '+(map[key()]||'sem marcação')};copy.onclick=async()=>{const lines=Object.entries(map).sort().map(([k,v])=>k+' = '+v).join('\n');try{await navigator.clipboard.writeText(lines);READ.textContent='✅ COPIADO. Cole no ChatGPT:\n\n'+lines}catch(e){READ.textContent=lines}};render()})();</script></body></html>
