<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Futlive • LAB Frames</title><style>*{box-sizing:border-box}body{margin:0;background:#07110e;color:#fff;font-family:system-ui,-apple-system,sans-serif}.hud{padding:14px;text-align:center;background:#075d2c;position:sticky;top:0;z-index:10}.hud b{font-size:18px}.panel{padding:10px}.row{display:flex;gap:6px;overflow:auto;padding:7px 0}.wrap{flex-wrap:wrap;overflow:visible}button{border:1px solid #29443a;background:#0d211a;color:#fff;padding:9px 10px;border-radius:9px;font-weight:800;font-size:11px;white-space:nowrap}button.active{outline:2px solid #ffd84d}.save{background:#164d2c;border-color:#43b66c}.title{font-size:10px;letter-spacing:1.2px;color:#a8c8b6;font-weight:900;margin:12px 0 5px}.previewbox{display:flex;gap:12px;align-items:center;background:#0b1c16;border:1px solid #29443a;border-radius:12px;padding:10px}.preview{width:100px;height:110px;object-fit:contain;background:#04100b;border-radius:8px}.meta{min-width:0}.frameName{font:900 14px ui-monospace,monospace;color:#ffe36b;word-break:break-all}.path{font:9px ui-monospace,monospace;color:#9cc9b0;margin-top:5px;word-break:break-all}.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.thumb{position:relative;height:92px;border:1px solid #27473a;border-radius:7px;background:#06100c;padding:3px;overflow:hidden}.thumb img{width:100%;height:68px;object-fit:contain}.thumb.on{border:2px solid #ffd84d}.thumb span{display:block;text-align:center;font:8px ui-monospace,monospace;color:#d9eee2}.read{margin-top:10px;font:10px ui-monospace,monospace;color:#9cc9b0;background:#030806;padding:9px;border-radius:8px;white-space:pre-wrap}</style></head><body><div class="hud"><b>🧪 LAB • MAPA DE FRAMES</b></div><div class="panel"><div class="title">PERSONAGEM</div><div class="row"><button data-char="blue">🔵 AZUL</button><button data-char="red">🔴 VERMELHO</button><button data-char="ref">🟨 JUIZ</button></div><div class="previewbox"><img id="preview" class="preview"><div class="meta"><div id="frameName" class="frameName"></div><div id="framePath" class="path"></div><div class="row"><button id="prev">←</button><button id="next">→</button></div></div></div><div class="title">MARCAR O QUE ESTE ARQUIVO É</div><div class="row wrap"><button data-mark="frente">Frente</button><button data-mark="costas">Costas</button><button data-mark="direita">Direita</button><button data-mark="esquerda">Esquerda</button><button data-mark="parado">Parado</button><button data-mark="corrida">Corrida</button><button data-mark="chute_passe">Chute/Passe</button><button data-mark="carrinho">Carrinho</button><button data-mark="segura_bola">Segura bola</button><button data-mark="lateral_maos">Lateral/mãos</button><button id="unmark">Desmarcar</button></div><div class="row"><button id="save" class="save">💾 SALVAR</button><button id="copy">📋 COPIAR TUDO</button></div><div class="title">32 ARQUIVOS — TOQUE PARA SELECIONAR</div><div id="strip" class="strip"></div><div id="read" class="read"></div></div><script>(()=>{const KEY='futlive_lab_filemap_v2',P=document.querySelector('#preview'),N=document.querySelector('#frameName'),PATH=document.querySelector('#framePath'),STRIP=document.querySelector('#strip'),READ=document.querySelector('#read');let char='blue',frame=1,map={};try{map=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}const pad=n=>String(n).padStart(3,'0');function info(){if(char==='blue')return{label:'AZUL',file:'frame_'+pad(frame)+'.png',path:'assets/players/team-1/frame_'+pad(frame)+'.png'};if(char==='red')return{label:'VERMELHO',file:'frame_'+pad(frame)+'.png',path:'assets/players/team-2/frame_'+pad(frame)+'.png'};return{label:'JUIZ',file:'frame_'+pad(frame)+'.png',path:'assets/referee/frame_'+pad(frame)+'.png'}}function key(){let i=info();return i.label+' / '+i.file}function render(){let i=info();P.src='./'+i.path;N.textContent=i.file;PATH.textContent=i.label+' • '+i.path;document.querySelectorAll('[data-char]').forEach(b=>b.classList.toggle('active',b.dataset.char===char));document.querySelectorAll('[data-mark]').forEach(b=>b.classList.toggle('active',b.dataset.mark===map[key()]));STRIP.innerHTML='';for(let n=1;n<=32;n++){let old=frame;frame=n;let x=info();frame=old;let d=document.createElement('div');d.className='thumb'+(n===frame?' on':'');d.innerHTML='<img src="./'+x.path+'"><span>'+x.file+'</span>';d.onclick=()=>{frame=n;render()};STRIP.appendChild(d)}READ.textContent=(map[key()]?'MARCADO: '+map[key()]+'\n':'')+'ARQUIVO ATUAL: '+key()}document.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{char=b.dataset.char;frame=1;render()});document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>{map[key()]=b.dataset.mark;render()});prev.onclick=()=>{frame=frame<=1?32:frame-1;render()};next.onclick=()=>{frame=frame>=32?1:frame+1;render()};unmark.onclick=()=>{delete map[key()];render()};save.onclick=()=>{localStorage.setItem(KEY,JSON.stringify(map));READ.textContent='✅ SALVO neste aparelho.\n'+key()+' = '+(map[key()]||'sem marcação')};copy.onclick=async()=>{const lines=Object.entries(map).sort().map(([k,v])=>k+' = '+v).join('\n');try{await navigator.clipboard.writeText(lines);READ.textContent='✅ COPIADO. Cole no ChatGPT:\n\n'+lines}catch(e){READ.textContent=lines}};render()})();</script></body></html>
