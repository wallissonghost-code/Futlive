<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Futlive • Laboratório</title><style>*{box-sizing:border-box}body{margin:0;background:#075d2c;color:#fff;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none}.hud{height:92px;display:flex;align-items:end;justify-content:center;padding:10px}.card{background:#071d17;border:2px solid #18382e;border-radius:17px;padding:8px 22px;text-align:center}.card b{font-size:18px}.card small{display:block;color:#9de0b4;letter-spacing:2px;font-size:9px}.stage{position:relative;width:100%;height:43vh;min-height:300px;max-height:430px;background:#208d35 url('./assets/maps/BDA9D67F-DDF2-4429-BF0A-84EC5AE497E8.png') center/cover no-repeat;overflow:hidden;touch-action:none;border-block:2px solid #fff}.actor{position:absolute;width:48px;height:56px;transform:translate(-50%,-70%);object-fit:contain;z-index:5;filter:drop-shadow(0 3px 2px #0005)}.actor.sel{filter:drop-shadow(0 0 7px #ffe34f) drop-shadow(0 3px 2px #0005)}.tag{position:absolute;transform:translate(-50%,-50%);font-size:9px;background:#061b14d9;padding:2px 5px;border-radius:7px;z-index:8;pointer-events:none}.ball{position:absolute;width:17px;height:17px;transform:translate(-50%,-50%);object-fit:contain;z-index:7}.shadow{position:absolute;width:18px;height:7px;border-radius:50%;background:#0006;transform:translate(-50%,-50%);z-index:4;display:none}.panel{background:#07110e;padding:10px 9px 28px;min-height:42vh}.title{font-size:10px;letter-spacing:1.5px;color:#b9c9c1;font-weight:800;margin-top:6px}.row{display:flex;gap:5px;overflow:auto;padding:6px 0}.row.wrap{flex-wrap:wrap;overflow:visible}button{flex:0 0 auto;border:1px solid #29443a;background:#0d211a;color:#fff;padding:8px 9px;border-radius:9px;font-weight:750;font-size:11px}button.active{outline:2px solid #f2d14e;background:#20321c}.framebox{display:flex;gap:8px;align-items:center;background:#0b1c16;border:1px solid #29443a;border-radius:10px;padding:7px}.preview{width:56px;height:62px;object-fit:contain;background:#06100c;border-radius:8px}.range{flex:1}.range input{width:100%}.read{font:10px ui-monospace,monospace;color:#9cc9b0;background:#030806;padding:7px;border-radius:8px}.air{position:absolute;border:1px dashed #ffffff70;border-radius:50%;width:25px;height:10px;z-index:3;pointer-events:none}</style></head><body><div class="hud"><div class="card"><b>🧪 LABORATÓRIO</b><small>FUTLIVE • BANCADA VISUAL</small></div></div><div id="stage" class="stage"><img id="p1" class="actor" data-team="1" style="left:37%;top:53%"><span id="p1t" class="tag">PLAYER 1</span><img id="p2" class="actor" data-team="2" style="left:61%;top:48%"><span id="p2t" class="tag">PLAYER 2</span><img id="gk" class="actor" data-team="1" data-gk="1" style="left:13%;top:50%"><span id="gkt" class="tag">GOLEIRO</span><div id="shadow" class="shadow"></div><img id="ball" class="ball" src="./assets/ball/frame_001.png" style="left:44%;top:55%"></div><div class="panel"><div class="title">PERSONAGEM</div><div class="row"><button data-sel="p1">🔵 P1</button><button data-sel="p2">⚫ P2</button><button data-sel="gk">🧤 GK</button><button id="give">⚽ Bola no pé</button><button id="pass2">P1 ⇄ P2</button></div><div class="title">FRAME / VISUAL 360°</div><div class="framebox"><img id="preview" class="preview"><div class="range"><div id="frameLabel">FRAME 01 / 32</div><input id="frameRange" type="range" min="1" max="32" value="1"><div class="row"><button data-face="down">Frente</button><button data-face="right">Direita</button><button data-face="up">Costas</button><button data-face="left">Esquerda</button></div></div></div><div class="title">CORRIDA</div><div class="row"><button data-dir="right">→</button><button data-dir="left">←</button><button data-dir="up">↑</button><button data-dir="down">↓</button><button data-dir="ur">↗</button><button data-dir="ul">↖</button><button data-dir="dr">↘</button><button data-dir="dl">↙</button><button id="stop">■</button></div><div class="title">CHUTES / AÇÕES</div><div class="row wrap"><button data-kick="weak">Chute fraco</button><button data-kick="medium">Chute médio</button><button data-kick="strong">💥 Forte</button><button data-kick="low">Chute baixo</button><button data-kick="high">⬆ Alto</button><button id="slide">Carrinho</button><button id="jump">Pular</button><button id="reset">Reset</button></div><div id="read" class="read">Selecione, arraste ou toque no campo. Bola é trazida automaticamente antes de chutes/passes.</div></div><script>(()=>{const S=stage,B=ball,SH=shadow,R=read,A=[p1,p2,gk];let sel=p1,owner=null,raf=0,frame=1,lastF=0,dir='down';const pad=n=>String(n).padStart(3,'0'),src=(a,n)=>'./assets/players/team-'+a.dataset.team+'/frame_'+pad(n)+'.png',ranges={down:[1,8],right:[9,16],up:[17,24],left:[25,32]};function pos(a){return{x:parseFloat(a.style.left),y:parseFloat(a.style.top)}}function image(a,n){a.src=src(a,n);if(a===sel){preview.src=a.src;frameRange.value=n;frameLabel.textContent='FRAME '+pad(n).slice(-2)+' / 32'}}function tags(){A.forEach(a=>{let t=document.querySelector('#'+a.id+'t'),p=pos(a);t.style.left=p.x+'%';t.style.top=(p.y-10)+'%'})}function select(a){A.forEach(x=>x.classList.remove('sel'));sel=a;a.classList.add('sel');image(a,frame);R.textContent='Selecionado: '+a.id.toUpperCase()}A.forEach(a=>image(a,1));select(p1);tags();document.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>select(document.querySelector('#'+b.dataset.sel)));frameRange.oninput=()=>{frame=+frameRange.value;image(sel,frame)};document.querySelectorAll('[data-face]').forEach(b=>b.onclick=()=>{dir=b.dataset.face;frame=ranges[dir][0];image(sel,frame)});function sync(){if(owner){let p=pos(owner),off=dir==='left'?-3:dir==='right'?3:0;B.style.left=(p.x+off)+'%';B.style.top=(p.y-1)+'%'}tags()}function give(a=sel){owner=a;sync();R.textContent='Bola no pé: '+a.id.toUpperCase()}give.onclick=()=>give(sel);function point(e){let r=S.getBoundingClientRect();return{x:Math.max(3,Math.min(97,(e.clientX-r.left)/r.width*100)),y:Math.max(8,Math.min(95,(e.clientY-r.top)/r.height*100))}}A.forEach(a=>a.onpointerdown=e=>{e.stopPropagation();select(a);a.setPointerCapture(e.pointerId);a.onpointermove=q=>{if(q.buttons){let p=point(q);a.style.left=p.x+'%';a.style.top=p.y+'%';sync()}};a.onpointerup=()=>a.onpointermove=null});S.onpointerdown=e=>{if(e.target!==S)return;let p=point(e);sel.style.left=p.x+'%';sel.style.top=p.y+'%';sync()};function run(dx,dy,d){cancelAnimationFrame(raf);dir=d;let visual=Math.abs(dx)>=Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down'),rg=ranges[visual],last=performance.now();function loop(t){let p=pos(sel),dt=Math.min(34,t-last)/16.67;last=t;p.x=Math.max(3,Math.min(97,p.x+dx*.13*dt));p.y=Math.max(8,Math.min(95,p.y+dy*.13*dt));sel.style.left=p.x+'%';sel.style.top=p.y+'%';if(t-lastF>115){frame++;if(frame<rg[0]||frame>rg[1])frame=rg[0];image(sel,frame);lastF=t}sync();raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop)}const D={right:[1,0,'right'],left:[-1,0,'left'],up:[0,-1,'up'],down:[0,1,'down'],ur:[.7,-.7,'right'],ul:[-.7,-.7,'left'],dr:[.7,.7,'right'],dl:[-.7,.7,'left']};document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>run(...D[b.dataset.dir]));stop.onclick=()=>cancelAnimationFrame(raf);function kick(kind,targetActor){give(sel);cancelAnimationFrame(raf);let p=pos(B),dx=dir==='left'?-1:dir==='right'?1:sel.dataset.team==='1'?1:-1,dy=dir==='up'?-1:dir==='down'?1:0;if(targetActor){let q=pos(targetActor),vx=q.x-p.x,vy=q.y-p.y,l=Math.hypot(vx,vy)||1;dx=vx/l;dy=vy/l}let speed={weak:.38,medium:.62,strong:1.0,low:.68,high:.72,pass:.55}[kind]||.6,n=0;owner=null;SH.style.display=kind==='high'?'block':'none';function fly(){n++;p.x+=dx*speed;p.y+=dy*speed;let lift=kind==='high'?Math.sin(Math.min(1,n/60)*Math.PI)*10:0;B.style.left=p.x+'%';B.style.top=(p.y-lift)+'%';SH.style.left=p.x+'%';SH.style.top=p.y+'%';if(kind==='high'&&n%9===0){let q=document.createElement('i');q.className='air';q.style.left=p.x+'%';q.style.top=p.y+'%';S.appendChild(q);setTimeout(()=>q.remove(),220)}if(targetActor&&Math.hypot(pos(targetActor).x-p.x,pos(targetActor).y-p.y)<3){owner=targetActor;sync();SH.style.display='none';return}if(p.x>1&&p.x<99&&p.y>2&&p.y<99&&n<180)raf=requestAnimationFrame(fly);else SH.style.display='none'}raf=requestAnimationFrame(fly);R.textContent=kind+' executado'}document.querySelectorAll('[data-kick]').forEach(b=>b.onclick=()=>kick(b.dataset.kick));pass2.onclick=()=>{let from=owner===p2?p2:p1,to=from===p1?p2:p1;select(from);give(from);kick('pass',to)};slide.onclick=()=>sel.animate([{transform:'translate(-50%,-70%)'},{transform:'translate(-50%,-70%) rotate(72deg)'},{transform:'translate(-50%,-70%)'}],{duration:500});jump.onclick=()=>sel.animate([{transform:'translate(-50%,-70%)'},{transform:'translate(-50%,-105%)'},{transform:'translate(-50%,-70%)'}],{duration:450});reset.onclick=()=>location.reload()})();</script></body></html>
