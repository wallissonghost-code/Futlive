<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Futlive • Laboratório</title><style>*{box-sizing:border-box}body{margin:0;background:#075d2c;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow-x:hidden;-webkit-user-select:none;user-select:none}.hud{height:116px;display:flex;align-items:end;justify-content:center;padding:14px;background:#075d2c}.card{background:#071d17;border:2px solid #18382e;border-radius:18px;padding:10px 24px;text-align:center;min-width:210px}.card b{font-size:20px}.card small{display:block;color:#9de0b4;letter-spacing:2px;font-size:10px;margin-top:4px}.stage{position:relative;width:100%;height:min(88vh,720px);min-height:510px;background:#208d35 url('./assets/maps/BDA9D67F-DDF2-4429-BF0A-84EC5AE497E8.png') center/cover no-repeat;overflow:hidden;touch-action:none;border-top:2px solid #fff;border-bottom:2px solid #fff}.actor{position:absolute;width:50px;height:58px;transform:translate(-50%,-70%);object-fit:contain;z-index:5;filter:drop-shadow(0 3px 2px #0005)}.actor.sel{filter:drop-shadow(0 0 7px #ffe34f) drop-shadow(0 3px 2px #0005)}.tag{position:absolute;transform:translate(-50%,-50%);font-size:10px;background:#061b14d9;padding:3px 6px;border-radius:8px;z-index:8;pointer-events:none}.ball{position:absolute;width:18px;height:18px;transform:translate(-50%,-50%);object-fit:contain;z-index:7;filter:drop-shadow(0 2px 2px #0008)}.shadow{position:absolute;width:18px;height:8px;border-radius:50%;background:#0005;transform:translate(-50%,-50%);z-index:4;display:none}.panel{background:#07110e;padding:12px 10px 30px;position:relative;z-index:20}.title{font-size:12px;letter-spacing:2px;color:#b9c9c1;font-weight:800}.row{display:flex;gap:6px;overflow:auto;padding:8px 0}.row.wrap{flex-wrap:wrap;overflow:visible}button{flex:0 0 auto;border:1px solid #29443a;background:#0d211a;color:#fff;padding:10px 11px;border-radius:10px;font-weight:750;font-size:12px}button.active{outline:2px solid #f2d14e;background:#20321c}.read{font:11px ui-monospace,monospace;color:#9cc9b0;background:#030806;padding:8px;border-radius:9px;min-height:38px}.trail{position:absolute;height:2px;background:#ffffff75;transform-origin:left center;z-index:3;pointer-events:none}.air{position:absolute;border:1px dashed #ffffff80;border-radius:50%;width:28px;height:12px;z-index:3;pointer-events:none}</style></head><body><div class="hud"><div class="card"><b>🧪 LABORATÓRIO</b><small>FUTLIVE • TESTE VISUAL</small></div></div><div id="stage" class="stage"><img id="p1" class="actor" data-team="1" style="left:38%;top:53%"><span id="p1t" class="tag">PLAYER 1</span><img id="p2" class="actor" data-team="2" style="left:61%;top:48%"><span id="p2t" class="tag">PLAYER 2</span><img id="gk" class="actor" data-team="1" data-gk="1" style="left:13%;top:50%"><span id="gkt" class="tag">GOLEIRO</span><div id="shadow" class="shadow"></div><img id="ball" class="ball" src="./assets/ball/frame_001.png" style="left:43%;top:54%"></div><div class="panel"><div class="title">PERSONAGEM / POSIÇÃO</div><div class="row"><button data-sel="p1">🔵 Player 1</button><button data-sel="p2">⚫ Player 2</button><button data-sel="gk">🧤 Goleiro</button><button id="toggle">2º player</button><button id="give">⚽ Bola no pé</button></div><div class="title">MOVIMENTO REAL POR FRAMES</div><div class="row"><button data-dir="right">→ Direita</button><button data-dir="left">← Esquerda</button><button data-dir="up">↑ Cima</button><button data-dir="down">↓ Baixo</button><button data-dir="ur">↗ Diagonal</button><button data-dir="dr">↘ Diagonal</button><button id="stop">■ Parar</button></div><div class="title">AÇÕES</div><div class="row wrap"><button data-act="pass">Passe</button><button data-act="shot">Chute</button><button data-act="power">💥 Chute forte</button><button data-act="lob">⬆ Chute alto</button><button data-act="jump">Pular</button><button data-act="slide">Carrinho</button><button id="reset">Reset</button></div><div id="read" class="read">Toque no personagem e depois no campo, ou arraste. Os jogadores usam os PNGs reais de 32 frames do Futlive.</div></div><script>(()=>{const S=document.querySelector('#stage'),B=document.querySelector('#ball'),SH=document.querySelector('#shadow'),R=document.querySelector('#read'),actors=[p1,p2,gk];let sel=p1,owner=null,raf=0,anim=0,frame=1,lastFrame=0,dir='down';const pad=n=>String(n).padStart(3,'0'),src=(a,n)=>a.dataset.gk?'./assets/players/team-1/frame_'+pad(n)+'.png':'./assets/players/team-'+a.dataset.team+'/frame_'+pad(n)+'.png';const ranges={down:[1,8],right:[9,16],up:[17,24],left:[25,32]};function face(d){dir=d;let r=ranges[d]||ranges.down;frame=r[0];actors.forEach(a=>{if(a===sel)a.src=src(a,frame)})}actors.forEach(a=>a.src=src(a,1));function pos(a){return{x:parseFloat(a.style.left),y:parseFloat(a.style.top)}}function tags(){actors.forEach(a=>{let t=document.querySelector('#'+a.id+'t'),p=pos(a);t.style.left=p.x+'%';t.style.top=(p.y-8)+'%'})}tags();function select(a){actors.forEach(x=>x.classList.remove('sel'));sel=a;sel.classList.add('sel');R.textContent='Selecionado: '+sel.id.toUpperCase()}select(p1);document.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>select(document.querySelector('#'+b.dataset.sel)));function sync(){if(owner===sel){let p=pos(sel),off=dir==='left'?-3:dir==='right'?3:0;B.style.left=(p.x+off)+'%';B.style.top=(p.y-1)+'%'}tags()}function point(e){let r=S.getBoundingClientRect();return{x:Math.max(3,Math.min(97,(e.clientX-r.left)/r.width*100)),y:Math.max(7,Math.min(96,(e.clientY-r.top)/r.height*100))}}actors.forEach(a=>a.onpointerdown=e=>{e.stopPropagation();select(a);a.setPointerCapture(e.pointerId);a.onpointermove=q=>{if(!q.buttons)return;let p=point(q);a.style.left=p.x+'%';a.style.top=p.y+'%';sync()};a.onpointerup=()=>a.onpointermove=null});S.onpointerdown=e=>{if(e.target!==S)return;let p=point(e);sel.style.left=p.x+'%';sel.style.top=p.y+'%';sync()};give.onclick=()=>{owner=sel;sync();R.textContent='Bola dominada por '+sel.id};toggle.onclick=()=>{p2.hidden=!p2.hidden;p2t.hidden=p2.hidden};function run(dx,dy,d){cancelAnimationFrame(raf);dir=d;let range=ranges[d]||ranges.right,last=performance.now();function loop(t){let p=pos(sel),dt=Math.min(34,t-last)/16.67;last=t;p.x=Math.max(3,Math.min(97,p.x+dx*.13*dt));p.y=Math.max(7,Math.min(96,p.y+dy*.13*dt));sel.style.left=p.x+'%';sel.style.top=p.y+'%';if(t-lastFrame>115){frame++;if(frame<range[0]||frame>range[1])frame=range[0];sel.src=src(sel,frame);lastFrame=t}sync();raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop)}const D={right:[1,0,'right'],left:[-1,0,'left'],up:[0,-1,'up'],down:[0,1,'down'],ur:[.7,-.7,'right'],dr:[.7,.7,'right']};document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>run(...D[b.dataset.dir]));stop.onclick=()=>{cancelAnimationFrame(raf);R.textContent='Movimento parado no frame '+frame};function kick(kind){if(owner!==sel){R.textContent='Coloque a bola no pé primeiro.';return}cancelAnimationFrame(raf);owner=null;let p=pos(B),target=pos(sel),dx=dir==='left'?-1:dir==='right'?1:sel.dataset.team==='1'?1:-1,dy=dir==='up'?-1:dir==='down'?1:0,speed=kind==='power'?1.05:kind==='pass'?.55:.78,n=0,startY=p.y;SH.style.display=kind==='lob'?'block':'none';function fly(){n++;p.x+=dx*speed;p.y+=dy*speed*.55;let lift=kind==='lob'?Math.sin(Math.min(1,n/65)*Math.PI)*11:0;B.style.left=p.x+'%';B.style.top=(p.y-lift)+'%';SH.style.left=p.x+'%';SH.style.top=p.y+'%';if(n%7===0&&kind==='lob'){let q=document.createElement('i');q.className='air';q.style.left=p.x+'%';q.style.top=p.y+'%';S.appendChild(q);setTimeout(()=>q.remove(),260)}if(p.x>1&&p.x<99&&p.y>2&&p.y<99&&n<150)raf=requestAnimationFrame(fly);else SH.style.display='none'}raf=requestAnimationFrame(fly);R.textContent=kind+' • direção '+dir}document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{let a=b.dataset.act;if(['pass','shot','power','lob'].includes(a))return kick(a);sel.animate(a==='jump'?[{transform:'translate(-50%,-70%)'},{transform:'translate(-50%,-100%)'},{transform:'translate(-50%,-70%)'}]:[{transform:'translate(-50%,-70%) rotate(0)'},{transform:'translate(-50%,-70%) rotate(70deg)'},{transform:'translate(-50%,-70%) rotate(0)'}],{duration:420});R.textContent='Teste: '+a});reset.onclick=()=>location.reload()})();</script></body></html>
