<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Futlive • Laboratório</title><style>*{box-sizing:border-box}body{margin:0;background:#07120d;color:#fff;font:14px system-ui;-webkit-user-select:none;user-select:none;touch-action:manipulation}.top{padding:12px 14px;background:#0b2016;position:sticky;top:0;z-index:5}.top b{font-size:17px}.top small{display:block;color:#91aa9c}.wrap{max-width:900px;margin:auto}.field{position:relative;margin:12px;height:min(56vw,470px);min-height:300px;background:linear-gradient(90deg,#29933d,#238738);border:2px solid #fff;overflow:hidden;touch-action:none}.field:before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #fff}.field:after{content:'';position:absolute;width:20%;aspect-ratio:1;border:2px solid #fff;border-radius:50%;left:40%;top:50%;transform:translateY(-50%)}.goal{position:absolute;top:32%;height:36%;width:10%;border:2px solid #fff}.goal.l{left:-2px}.goal.r{right:-2px}.p{position:absolute;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;transform:translate(-50%,-50%);z-index:2;border:3px solid #fff;box-shadow:0 3px 8px #0008;transition:filter .15s}.p.sel{filter:drop-shadow(0 0 7px #ffda55)}.blue{background:#1672dc}.red{background:#e74343}.gk{background:#178f86}.ball{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;border:3px dotted #222;transform:translate(-50%,-50%);z-index:3}.panel{padding:0 12px 24px}.row{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}button{border:1px solid #345346;background:#10251b;color:#fff;border-radius:10px;padding:10px 12px;font-weight:700}button.on{outline:2px solid #f0c84b}.hint{color:#a9b9b0;font-size:12px}.log{background:#050b08;border:1px solid #263a31;border-radius:10px;padding:9px;height:74px;overflow:auto;font:11px monospace;color:#b8d7c5}</style></head><body><div class="wrap"><div class="top"><b>🧪 Laboratório de Teste</b><small>Ambiente isolado — não altera a partida principal</small></div><div id="field" class="field"><div class="goal l"></div><div class="goal r"></div><div class="p blue" data-id="p1" style="left:35%;top:45%">P1</div><div class="p red" data-id="p2" style="left:55%;top:55%">P2</div><div class="p gk" data-id="gk" style="left:8%;top:50%">GK</div><div id="ball" class="ball" style="left:38%;top:45%"></div></div><div class="panel"><div class="hint">Toque em um jogador e depois no campo para posicioná-lo. Também pode arrastar.</div><div class="row"><button data-sel="p1">P1</button><button data-sel="p2">P2</button><button data-sel="gk">Goleiro</button><button id="toggleP2">2º player ON/OFF</button><button id="give">⚽ Bola no pé</button></div><div class="row"><button data-move="right">→ Reto</button><button data-move="left">← Esquerda</button><button data-move="up">↑ Cima</button><button data-move="down">↓ Baixo</button><button data-move="ur">↗ Diagonal</button><button data-move="dr">↘ Diagonal</button></div><div class="row"><button data-act="pass">Passe</button><button data-act="shot">Chute</button><button data-act="power">💥 Chute forte</button><button data-act="lob">⬆️ Chute alto</button><button data-act="jump">Pular</button><button data-act="slide">Carrinho</button><button id="stop">Parar</button><button id="reset">Reset</button></div><div id="log" class="log">LAB pronto.</div></div></div><script>(()=>{const f=document.querySelector('#field'),ball=document.querySelector('#ball'),log=document.querySelector('#log');let sel=document.querySelector('[data-id=p1]'),owner=null,raf=null;const say=s=>{log.innerHTML=s+'<br>'+log.innerHTML};const xy=e=>{const r=f.getBoundingClientRect(),t=e.touches?.[0]||e;return{x:Math.max(3,Math.min(97,(t.clientX-r.left)/r.width*100)),y:Math.max(5,Math.min(95,(t.clientY-r.top)/r.height*100))}};function select(p){document.querySelectorAll('.p').forEach(x=>x.classList.remove('sel'));sel=p;sel.classList.add('sel');say('Selecionado: '+sel.dataset.id)}select(sel);document.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>select(document.querySelector('[data-id='+b.dataset.sel+']')));document.querySelectorAll('.p').forEach(p=>{p.onpointerdown=e=>{e.stopPropagation();select(p);p.setPointerCapture(e.pointerId);p.onpointermove=q=>{if(q.buttons){let a=xy(q);p.style.left=a.x+'%';p.style.top=a.y+'%';sync()}};p.onpointerup=()=>p.onpointermove=null}});f.onpointerdown=e=>{if(e.target!==f)return;let a=xy(e);sel.style.left=a.x+'%';sel.style.top=a.y+'%';sync()};function pos(el){return{x:parseFloat(el.style.left),y:parseFloat(el.style.top)}}function sync(){if(owner===sel){let p=pos(sel);ball.style.left=(p.x+3)+'%';ball.style.top=p.y+'%'}}give.onclick=()=>{owner=sel;sync();say('Bola dominada por '+sel.dataset.id)};toggleP2.onclick=()=>{let p=document.querySelector('[data-id=p2]');p.hidden=!p.hidden;say('P2 '+(p.hidden?'OFF':'ON'))};function move(dx,dy){cancelAnimationFrame(raf);let last=performance.now();function go(t){let p=pos(sel),dt=Math.min(32,t-last)/16.67;last=t;p.x=Math.max(3,Math.min(97,p.x+dx*.18*dt));p.y=Math.max(5,Math.min(95,p.y+dy*.18*dt));sel.style.left=p.x+'%';sel.style.top=p.y+'%';sync();raf=requestAnimationFrame(go)}raf=requestAnimationFrame(go)}const dirs={right:[1,0],left:[-1,0],up:[0,-1],down:[0,1],ur:[.7,-.7],dr:[.7,.7]};document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let d=dirs[b.dataset.move];move(...d);say('Corrida '+b.dataset.move)});stop.onclick=()=>{cancelAnimationFrame(raf);say('Parado')};function kick(kind){if(owner!==sel){say('Sem bola: '+sel.dataset.id);return}owner=null;cancelAnimationFrame(raf);let p=pos(ball),speed=kind==='power'?1.25:kind==='lob'?.8:.65,dx=sel.classList.contains('red')?-1:1,vy=(Math.random()-.5)*.18,n=0;function go(){p.x+=dx*speed;p.y+=vy;n++;ball.style.left=p.x+'%';ball.style.top=(p.y-(kind==='lob'?Math.sin(Math.min(1,n/45)*Math.PI)*9:0))+'%';if(p.x>1&&p.x<99&&p.y>2&&p.y<98&&n<180)raf=requestAnimationFrame(go)}raf=requestAnimationFrame(go);say(kind+' executado')};document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{let a=b.dataset.act;if(['shot','power','lob','pass'].includes(a))kick(a);else{say(a+' executado');sel.animate(a==='jump'?[{transform:'translate(-50%,-50%)'},{transform:'translate(-50%,-75%)'},{transform:'translate(-50%,-50%)'}]:[{transform:'translate(-50%,-50%) rotate(0)'},{transform:'translate(-50%,-50%) rotate(70deg)'},{transform:'translate(-50%,-50%) rotate(0)'}],{duration:450})}});reset.onclick=()=>location.reload()})();</script></body></html>
