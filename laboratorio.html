<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Futlive • LAB Tático</title><style>*{box-sizing:border-box}body{margin:0;background:#075d2c;color:#fff;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none}.hud{height:72px;display:flex;align-items:end;justify-content:center;padding:7px}.card{background:#071d17;border:2px solid #18382e;border-radius:15px;padding:6px 20px;text-align:center}.card b{font-size:17px}.card small{display:block;color:#9de0b4;letter-spacing:2px;font-size:8px}.stage{position:relative;width:100%;height:40vh;min-height:290px;max-height:410px;background:#208d35 url('./assets/maps/BDA9D67F-DDF2-4429-BF0A-84EC5AE497E8.png') center/cover no-repeat;overflow:hidden;touch-action:none;border-block:2px solid #fff}.actor{position:absolute;width:46px;height:54px;transform:translate(-50%,-70%);object-fit:contain;z-index:5;filter:drop-shadow(0 3px 2px #0005)}.actor.sel{filter:drop-shadow(0 0 7px #ffe34f) drop-shadow(0 3px 2px #0005)}.tag{position:absolute;transform:translate(-50%,-50%);font-size:8px;background:#061b14dd;padding:2px 5px;border-radius:7px;z-index:8;pointer-events:none}.ball{position:absolute;width:17px;height:17px;transform:translate(-50%,-50%);object-fit:contain;z-index:7}.panel{background:#07110e;padding:9px 8px 28px}.title{font-size:10px;letter-spacing:1.4px;color:#b9c9c1;font-weight:800;margin-top:7px}.row{display:flex;gap:5px;overflow:auto;padding:6px 0}.row.wrap{flex-wrap:wrap;overflow:visible}button{flex:0 0 auto;border:1px solid #29443a;background:#0d211a;color:#fff;padding:8px 9px;border-radius:9px;font-weight:750;font-size:10px}button.active{outline:2px solid #f2d14e}.framebox{display:flex;gap:7px;align-items:center;background:#0b1c16;border:1px solid #29443a;border-radius:10px;padding:6px}.preview{width:52px;height:58px;object-fit:contain;background:#06100c;border-radius:7px}.range{flex:1}.range input{width:100%}.strip{display:flex;gap:3px;overflow:auto;padding:5px 0}.thumb{position:relative;flex:0 0 43px;height:52px;border:1px solid #27473a;border-radius:6px;background:#06100c;padding:2px}.thumb img{width:100%;height:100%;object-fit:contain}.thumb.on{border:2px solid #ffd84d}.thumb i{position:absolute;right:2px;bottom:1px;font:7px monospace;background:#000b;padding:1px 2px;border-radius:3px}.read{font:9px ui-monospace,monospace;color:#9cc9b0;background:#030806;padding:6px;border-radius:7px}.steps{display:flex;gap:4px;overflow:auto;padding:5px 0}.step{min-width:66px;text-align:center}.step.saved{border-color:#4ecb77}.path{position:absolute;height:2px;background:#ffe45c99;transform-origin:left center;z-index:2;pointer-events:none}</style></head><body><div class="hud"><div class="card"><b>🧪 LAB TÁTICO</b><small>FRAMES • MOVIMENTO • JOGADAS</small></div></div><div id="stage" class="stage"><img id="p1" class="actor" data-team="1" style="left:35%;top:54%"><span id="p1t" class="tag">P1</span><img id="p2" class="actor" data-team="2" style="left:62%;top:48%"><span id="p2t" class="tag">P2</span><img id="gk" class="actor" data-team="1" style="left:12%;top:50%"><span id="gkt" class="tag">GK</span><img id="ball" class="ball" src="./assets/ball/frame_001.png" style="left:43%;top:56%"></div><div class="panel"><div class="title">PERSONAGEM / JOGADA</div><div class="row"><button data-sel="p1">🔵 P1</button><button data-sel="p2">⚫ P2</button><button data-sel="gk">🧤 GK</button><button id="give">⚽ Pé</button><button id="pass2">P1 ⇄ P2</button><button id="saveStep">＋ Etapa</button><button id="playSteps">▶ Jogada</button><button id="clearSteps">Limpar</button></div><div id="steps" class="steps"></div><div class="title">INSPETOR DE FRAME</div><div class="framebox"><img id="preview" class="preview"><div class="range"><div id="frameLabel">FRAME 01 / 32</div><input id="frameRange" type="range" min="1" max="32" value="1"><div class="row"><button data-face="down">Frente 1–8</button><button data-face="right">Direita 9–16</button><button data-face="up">Costas 17–24</button><button data-face="left">Esq. 25–32</button></div></div></div><div class="title">FRAMES QUE A CORRIDA DEVE USAR</div><div id="strip" class="strip"></div><div class="row"><button data-show="down">Ver frente</button><button data-show="right">Ver direita</button><button data-show="up">Ver costas</button><button data-show="left">Ver esquerda</button><button id="testFrames">▶ Testar frames</button></div><div class="title">CORRIDA / DIREÇÃO</div><div class="row"><button data-dir="right">→</button><button data-dir="left">←</button><button data-dir="up">↑</button><button data-dir="down">↓</button><button data-dir="ur">↗</button><button data-dir="ul">↖</button><button data-dir="dr">↘</button><button data-dir="dl">↙</button><button id="stop">■</button></div><div class="title">AÇÕES</div><div class="row wrap"><button data-kick="weak">Chute fraco</button><button data-kick="medium">Médio</button><button data-kick="strong">💥 Forte</button><button data-kick="high">⬆ Alto</button><button id="slide">Carrinho por frame</button><button id="reset">Reset</button></div><div id="read" class="read">Arraste os 3 personagens. Salve etapas para montar uma jogada. O inspetor mostra exatamente quais frames pertencem a cada direção.</div></div><script>(()=>{const S=stage,B=ball,R=read,A=[p1,p2,gk],ranges={down:[1,8],right:[9,16],up:[17,24],left:[25,32]};let sel=p1,owner=null,raf=0,frame=1,lastF=0,dir='down',shown='down',stepsData=[];const pad=n=>String(n).padStart(3,'0'),src=(a,n)=>'./assets/players/team-'+a.dataset.team+'/frame_'+pad(n)+'.png';function pos(a){return{x:parseFloat(a.style.left),y:parseFloat(a.style.top)}}function image(a,n){a.src=src(a,n);if(a===sel){preview.src=a.src;frameRange.value=n;frameLabel.textContent='FRAME '+String(n).padStart(2,'0')+' / 32';mark(n)}}function tags(){A.forEach(a=>{let t=document.querySelector('#'+a.id+'t'),p=pos(a);t.style.left=p.x+'%';t.style.top=(p.y-9)+'%'})}function select(a){A.forEach(x=>x.classList.remove('sel'));sel=a;a.classList.add('sel');image(a,frame);renderStrip(shown)}A.forEach(a=>image(a,1));select(p1);tags();document.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>select(document.querySelector('#'+b.dataset.sel)));frameRange.oninput=()=>{frame=+frameRange.value;image(sel,frame)};function renderStrip(d){shown=d;strip.innerHTML='';let [a,b]=ranges[d];for(let n=a;n<=b;n++){let x=document.createElement('div');x.className='thumb';x.dataset.n=n;x.innerHTML='<img src="'+src(sel,n)+'"><i>'+n+'</i>';x.onclick=()=>{frame=n;image(sel,n)};strip.appendChild(x)}R.textContent='Sequência '+d+': frames '+a+'–'+b}function mark(n){document.querySelectorAll('.thumb').forEach(x=>x.classList.toggle('on',+x.dataset.n===n))}renderStrip('down');document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>renderStrip(b.dataset.show));document.querySelectorAll('[data-face]').forEach(b=>b.onclick=()=>{dir=b.dataset.face;frame=ranges[dir][0];image(sel,frame);renderStrip(dir)});testFrames.onclick=()=>{cancelAnimationFrame(raf);let [a,b]=ranges[shown],n=a;function go(){frame=n;image(sel,n);n=n>=b?a:n+1;raf=setTimeout(go,130)}go()};function sync(){if(owner){let p=pos(owner),off=dir==='left'?-3:dir==='right'?3:0;B.style.left=(p.x+off)+'%';B.style.top=(p.y-1)+'%'}tags()}function give(a=sel){owner=a;sync()}give.onclick=()=>give(sel);function point(e){let r=S.getBoundingClientRect();return{x:Math.max(3,Math.min(97,(e.clientX-r.left)/r.width*100)),y:Math.max(8,Math.min(95,(e.clientY-r.top)/r.height*100))}}A.forEach(a=>a.onpointerdown=e=>{e.stopPropagation();select(a);a.setPointerCapture(e.pointerId);a.onpointermove=q=>{if(q.buttons){let p=point(q);a.style.left=p.x+'%';a.style.top=p.y+'%';sync()}};a.onpointerup=()=>a.onpointermove=null});S.onpointerdown=e=>{if(e.target!==S)return;let p=point(e);sel.style.left=p.x+'%';sel.style.top=p.y+'%';sync()};function run(dx,dy,d){cancelAnimationFrame(raf);clearTimeout(raf);dir=d;let visual=Math.abs(dx)>=Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down'),rg=ranges[visual],last=performance.now();renderStrip(visual);function loop(t){let p=pos(sel),dt=Math.min(34,t-last)/16.67;last=t;p.x=Math.max(3,Math.min(97,p.x+dx*.13*dt));p.y=Math.max(8,Math.min(95,p.y+dy*.13*dt));sel.style.left=p.x+'%';sel.style.top=p.y+'%';if(t-lastF>120){frame++;if(frame<rg[0]||frame>rg[1])frame=rg[0];image(sel,frame);lastF=t}sync();raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop)}const D={right:[1,0,'right'],left:[-1,0,'left'],up:[0,-1,'up'],down:[0,1,'down'],ur:[.7,-.7,'right'],ul:[-.7,-.7,'left'],dr:[.7,.7,'right'],dl:[-.7,.7,'left']};document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>run(...D[b.dataset.dir]));stop.onclick=()=>{cancelAnimationFrame(raf);clearTimeout(raf)};function kick(kind,target){give(sel);cancelAnimationFrame(raf);let p=pos(B),dx=dir==='left'?-1:dir==='right'?1:sel.dataset.team==='1'?1:-1,dy=dir==='up'?-1:dir==='down'?1:0;if(target){let q=pos(target),vx=q.x-p.x,vy=q.y-p.y,l=Math.hypot(vx,vy)||1;dx=vx/l;dy=vy/l}let speed={weak:.38,medium:.62,strong:1,high:.7,pass:.55}[kind],n=0;owner=null;function fly(){n++;p.x+=dx*speed;p.y+=dy*speed;let lift=kind==='high'?Math.sin(Math.min(1,n/60)*Math.PI)*10:0;B.style.left=p.x+'%';B.style.top=(p.y-lift)+'%';if(target&&Math.hypot(pos(target).x-p.x,pos(target).y-p.y)<3){owner=target;sync();return}if(p.x>1&&p.x<99&&p.y>2&&p.y<99&&n<180)raf=requestAnimationFrame(fly)}raf=requestAnimationFrame(fly)}document.querySelectorAll('[data-kick]').forEach(b=>b.onclick=()=>kick(b.dataset.kick));pass2.onclick=()=>{let from=owner===p2?p2:p1,to=from===p1?p2:p1;select(from);kick('pass',to)};slide.onclick=()=>{cancelAnimationFrame(raf);clearTimeout(raf);let rg=ranges[dir]||ranges.down,n=rg[rg.length-1]||rg[1],seq=[Math.max(rg[0],rg[1]-2),Math.max(rg[0],rg[1]-1),rg[1],rg[1],Math.max(rg[0],rg[1]-1),rg[0]],i=0;function go(){frame=seq[i++];image(sel,frame);if(i<seq.length)raf=setTimeout(go,100)}go();R.textContent='Carrinho: sequência de frames, sem rotação CSS'};function snap(){return{actors:A.map(a=>({id:a.id,...pos(a),frame:a===sel?frame:null})),owner:owner?.id||null}}function renderSteps(){steps.innerHTML='';stepsData.forEach((s,i)=>{let b=document.createElement('button');b.className='step saved';b.textContent='ETAPA '+(i+1);b.onclick=()=>apply(s);steps.appendChild(b)})}function apply(s){s.actors.forEach(q=>{let a=document.querySelector('#'+q.id);a.style.left=q.x+'%';a.style.top=q.y+'%'});owner=s.owner?document.querySelector('#'+s.owner):null;sync()}saveStep.onclick=()=>{stepsData.push(snap());renderSteps();R.textContent='Etapa '+stepsData.length+' salva'};playSteps.onclick=()=>{if(!stepsData.length)return;let i=0;function next(){apply(stepsData[i++]);if(i<stepsData.length)setTimeout(next,650)}next()};clearSteps.onclick=()=>{stepsData=[];renderSteps()};reset.onclick=()=>location.reload()})();</script></body></html>
