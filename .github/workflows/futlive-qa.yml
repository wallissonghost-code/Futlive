name: Futlive QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  match-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install QA dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Futlive
        run: |
          python3 -m http.server 4173 > /tmp/futlive-http.log 2>&1 &
          echo $! > /tmp/futlive-http.pid
          sleep 2

      - name: Run simulated match QA
        run: npm run test:match

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: futlive-qa-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
